<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <title>Pedido - Panadería</title>
</head>
<body>

  <h1>Hacé tu pedido</h1>

  <form action="/pedidos" method="POST">

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>
    <br><br>

    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono" required>
    <br><br>

    <label for="producto">Producto:</label>
    <select id="producto" name="producto" required>
      <option value="">Elegí una opción</option>
      <option value="medialunas">Medialunas</option>
      <option value="facturas">Facturas</option>
      <option value="pan">Pan</option>
      <option value="tortas">Tortas</option>
      <option value="sandwiches">Sándwiches de miga</option>
    </select>
    <br><br>

    <label for="cantidad">Cantidad:</label>
    <input type="number" id="cantidad" name="cantidad" min="1" required>
    <br><br>

    <label for="retiro">Fecha de retiro:</label>
    <input type="date" id="retiro" name="retiro" required>
    <br><br>

    <button type="submit">Enviar pedido</button>

  </form>

</body>
</html>
